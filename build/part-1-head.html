<title>AngularJS Día 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F7F3F0;
  --surface:#FFFFFF;
  --surface-2:#F0E9E4;
  --line:#E0D6CF;
  --line-soft:#EDE5DF;
  --ink:#1D1613;
  --ink-2:#5A4D46;
  --ink-3:#8B7B72;
  --accent:#B52E31;
  --accent-soft:#F9E9E8;
  --live:#0E6A60;
  --live-soft:#E2F0ED;
  --warn:#9A6410;
  --warn-soft:#F8EEDC;
  --shadow:0 1px 2px rgba(29,22,19,.06), 0 8px 24px -16px rgba(29,22,19,.28);

  --code-bg:#1E1917;
  --code-bg-2:#272120;
  --code-line:#3A312D;
  --code-ink:#EDE4DF;
  --c-comment:#7E6F68;
  --c-key:#F2777A;
  --c-str:#9CC48B;
  --c-num:#E3B155;
  --c-fn:#7FB4CE;
  --c-attr:#D7A162;
  --c-punct:#9C8D86;

  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --cond:"IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --rail:274px;
  --repl-h:clamp(430px, 60vh, 700px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141010;
    --surface:#1C1716;
    --surface-2:#251E1C;
    --line:#352B28;
    --line-soft:#2A2321;
    --ink:#F3EBE6;
    --ink-2:#C2B4AC;
    --ink-3:#8D7D75;
    --accent:#E8595B;
    --accent-soft:#391E1F;
    --live:#55C0AE;
    --live-soft:#0F312C;
    --warn:#D9A249;
    --warn-soft:#332614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#141010;
  --surface:#1C1716;
  --surface-2:#251E1C;
  --line:#352B28;
  --line-soft:#2A2321;
  --ink:#F3EBE6;
  --ink-2:#C2B4AC;
  --ink-3:#8D7D75;
  --accent:#E8595B;
  --accent-soft:#391E1F;
  --live:#55C0AE;
  --live-soft:#0F312C;
  --warn:#D9A249;
  --warn-soft:#332614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

.masthead{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.shield{
  font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.06em;
  color:#fff;background:var(--accent);padding:4px 9px 11px;
  clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);line-height:1;
}
.brand h1{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
.spacer{flex:1 1 auto}
.daystrip{display:flex;gap:4px;align-items:center;overflow-x:auto;max-width:100%}
.daystrip .d{
  font-family:var(--mono);font-size:10.5px;padding:3px 8px;border:1px solid var(--line);
  border-radius:999px;color:var(--ink-3);white-space:nowrap;
}
a.d{text-decoration:none}
a.d:hover{border-color:var(--accent);color:var(--accent)}
.daystrip .d.now{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.tbtn{
  font:inherit;font-size:11.5px;font-family:var(--mono);cursor:pointer;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:4px;padding:4px 9px;white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}

.body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}

/* ---------- agenda rail ---------- */
.rail{
  border-right:1px solid var(--line);background:var(--surface);
  overflow:auto;min-height:0;padding:14px 0 calc(24px + env(safe-area-inset-bottom,0px));
}
.rail-head{padding:0 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rail-head .eyebrow{font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.rail-head .clock{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.agenda{list-style:none;margin:0;padding:0 8px;display:flex;flex-direction:column;gap:1px}
.ai{
  display:grid;grid-template-columns:44px minmax(0,1fr);gap:9px;align-items:start;
  width:100%;text-align:left;background:none;border:0;border-radius:6px;
  padding:8px;cursor:pointer;font:inherit;color:inherit;position:relative;
}
.ai:hover{background:var(--surface-2)}
.ai .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums}
.ai .ttl{font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.ai .kind{
  display:block;font-family:var(--cond);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin-top:3px;
}
.ai[aria-current="true"]{background:var(--accent-soft)}
.ai[aria-current="true"] .ttl{color:var(--ink);font-weight:600}
.ai[aria-current="true"] .t{color:var(--accent)}
.ai[aria-current="true"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--accent);border-radius:2px}
.ai.is-break{opacity:.7}
.ai.is-break .ttl{font-style:italic}
.ai.is-reto .kind,.ai.is-cierre .kind{color:var(--accent)}
.rail-foot{padding:14px 16px 0;margin:10px 8px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3)}
.rail-foot b{color:var(--ink-2);font-weight:600;font-family:var(--cond);letter-spacing:.04em}

/* ---------- main ---------- */
.main{overflow:auto;min-height:0;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 0}

.lhead{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.lmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.lmeta .pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.lmeta .pill.mod{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lmeta .pill.hour{font-variant-numeric:tabular-nums}
.lhead h2{
  font-family:var(--cond);font-weight:700;font-size:clamp(25px,4vw,33px);line-height:1.12;
  letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance;
}
.goal{font-size:15.5px;color:var(--ink-2);max-width:68ch;margin:0}

.note{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;
}
.note > :first-child{margin-top:0}
.note > :last-child{margin-bottom:0}
.note h3{
  font-family:var(--cond);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 8px;font-weight:600;
}
.note h4{font-size:15px;font-weight:600;margin:16px 0 4px}
.note p{margin:0 0 10px;max-width:74ch}
.note ul,.note ol{margin:0 0 10px;padding-left:20px;max-width:74ch}
.note li{margin-bottom:5px}
.note li::marker{color:var(--ink-3)}
.note strong{font-weight:600}
code{
  font-family:var(--mono);font-size:.875em;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:3px;padding:.5px 4px;color:var(--ink);
}
.note a{color:var(--accent)}

.tblwrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:6px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
table.tbl th,table.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.tbl thead th{
  font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line);
}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td:first-child{font-weight:500}

.callout{
  border-left:3px solid var(--warn);background:var(--warn-soft);
  padding:10px 14px;border-radius:0 6px 6px 0;margin:0 0 12px;font-size:14px;
}
.callout b{font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase;font-size:10.5px;color:var(--warn);display:block;margin-bottom:2px}
.callout.ok{border-left-color:var(--live);background:var(--live-soft)}
.callout.ok b{color:var(--live)}
.callout p{margin:0 0 8px;max-width:74ch}
.callout p:last-child{margin-bottom:0}

/* ---------- repl ---------- */
.repl{
  border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);
  box-shadow:var(--shadow);margin-bottom:16px;
}
.repl-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);
}
.repl-bar .label{
  font-family:var(--cond);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.segbtn{display:none;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.segbtn button{
  font:inherit;font-family:var(--mono);font-size:11.5px;padding:4px 12px;border:0;cursor:pointer;
  background:var(--surface);color:var(--ink-3);
}
.segbtn button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{
  font:inherit;font-family:var(--mono);font-size:11.5px;cursor:pointer;border-radius:5px;
  padding:4px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.run{background:var(--live);border-color:var(--live);color:#fff;font-weight:500}
.btn.run:hover{filter:brightness(1.08);color:#fff}
.btn.sol{border-color:var(--accent);color:var(--accent)}
.btn.sol:hover{background:var(--accent-soft);color:var(--accent)}

.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:var(--repl-h)}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.pane.code{border-right:1px solid var(--line);background:var(--code-bg)}

.tabs{display:flex;gap:0;overflow-x:auto;background:var(--code-bg-2);border-bottom:1px solid var(--code-line)}
.tabs button{
  font:inherit;font-family:var(--mono);font-size:11.5px;white-space:nowrap;cursor:pointer;
  background:none;border:0;border-right:1px solid var(--code-line);border-bottom:2px solid transparent;
  padding:7px 12px;color:#8E807A;
}
.tabs button:hover{color:var(--code-ink)}
.tabs button[aria-selected="true"]{color:var(--code-ink);background:var(--code-bg);border-bottom-color:var(--c-key)}

.edit{overflow:auto;min-height:0;background:var(--code-bg)}
.edit .inner{position:relative;min-height:100%}
.edit .layer{
  margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.62;
  padding:12px 14px;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;
  tab-size:2;border:0;letter-spacing:0;
}
.edit pre.layer{color:var(--code-ink);pointer-events:none;min-height:100%}
.edit pre.layer code{background:none;border:0;padding:0;font-size:inherit;color:inherit;font-family:inherit;line-height:inherit}
.edit textarea.layer{
  position:absolute;top:0;right:0;bottom:0;left:0;resize:none;overflow:hidden;
  background:transparent;color:transparent;caret-color:#F6B99B;outline:none;display:block;
}
.edit textarea.layer::selection{background:rgba(242,119,122,.32)}

.pane.out{background:var(--surface)}
.outbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--surface-2);border-bottom:1px solid var(--line);min-width:0;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.dot.err{background:var(--accent)}
.urlbar{
  flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:11.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:3px 8px;color:var(--ink-2);
}
.urlbar:focus{outline:none;border-color:var(--live);color:var(--ink)}
/* Flex y no grid: un max-height en % dentro de una fila "auto" no tiene contra
   qué resolverse y la consola quedaba aplastada a media línea. */
.outbody{display:flex;flex-direction:column;min-height:0}
.frame{flex:1 1 auto;min-height:120px;width:100%;border:0;background:#fff;display:block}
.console{
  flex:0 0 auto;min-height:96px;max-height:45%;overflow:auto;
  border-top:2px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:0;
}
.console[hidden]{display:none!important}
.console .ln{padding:6px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink);white-space:pre-wrap;overflow-wrap:break-word}
.console .ln:last-child{border-bottom:0}
.console .ln.error{color:var(--accent);background:var(--accent-soft);font-weight:500}
.console .ln.warn{color:var(--warn);background:var(--warn-soft);font-weight:500}
.console .ln .tag{
  display:inline-block;min-width:44px;margin-right:8px;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;
}
.console .ln.error .tag,.console .ln.warn .tag{color:inherit}
@media (max-width: 900px){
  .console{max-height:40%}
}

/* ---------- challenge ---------- */
.reto{
  border:1px solid var(--accent);border-radius:8px;background:var(--surface);
  padding:14px 18px;margin-bottom:16px;
}
.reto h3{
  font-family:var(--cond);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px;font-weight:700;
}
.reto ol,.reto ul{margin:0;padding-left:20px;max-width:74ch}
.reto li{margin-bottom:6px}
.reto li:last-child{margin-bottom:0}
.reto li::marker{color:var(--accent)}

/* ---------- nav ---------- */
.lnav{display:flex;gap:10px;justify-content:space-between;align-items:stretch;margin:22px 0 0}
.lnav a{
  flex:1 1 0;min-width:0;text-decoration:none;color:inherit;border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;background:var(--surface);display:block;
}
.lnav a:hover{border-color:var(--ink-3)}
.lnav a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.lnav .dir{font-family:var(--cond);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);display:block}
.lnav .nx{text-align:right}
.lnav .nm{font-size:14px;color:var(--ink-2);display:block;margin-top:2px}

.breakcard{
  border:1px dashed var(--line);border-radius:9px;background:var(--surface);
  padding:28px 22px;text-align:center;margin-bottom:16px;
}
.breakcard .big{font-family:var(--cond);font-size:34px;font-weight:700;color:var(--ink-3);letter-spacing:-.01em}
.breakcard p{margin:6px auto 0;max-width:50ch;color:var(--ink-2)}

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  :root{--rail:240px}
}
@media (max-width: 900px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{
    border-right:0;border-bottom:1px solid var(--line);max-height:38vh;
    padding:10px 0;
  }
  .rail[hidden]{display:none!important}
  .railtoggle{display:inline-flex!important}
  .panes{grid-template-columns:minmax(0,1fr);height:auto}
  .pane{height:var(--repl-h)}
  .pane.code{border-right:0;border-bottom:1px solid var(--line)}
  .segbtn{display:flex}
  .repl[data-pane="code"] .pane.out{display:none}
  .repl[data-pane="out"] .pane.code{display:none}
  .wrap{padding:16px 16px 0}
  .brand .sub{display:none}
}
@media (max-width: 560px){
  .lnav{flex-direction:column}
  .daystrip{display:none}
}
</style>
