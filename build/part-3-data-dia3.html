  goal: "Hacer que el router espere a los datos antes de pintar la pantalla, y cerrar el paso a las rutas privadas cuando no hay sesión.",
  notes: `
    <h3>Repaso exprés de ngRoute</h3>
    <p>En la sesión 1 montamos el router con <code>$routeProvider.when()</code>, <code>ng-view</code>, <code>templateUrl</code>, <code>otherwise</code> y <code>$routeParams</code>. En la sesión 2 aprendimos a enrutar hacia un <strong>componente</strong>: la plantilla de la ruta se limita a instanciarlo, <code>template: '&lt;lista-cursos&gt;&lt;/lista-cursos&gt;'</code>. Hoy seguimos por ahí.</p>

    <h3>El problema: la pantalla llega antes que los datos</h3>
    <p>Si el componente pide los datos en su <code>$onInit</code>, durante unos cientos de milisegundos se ve una plantilla vacía, y el componente tiene que gestionar el "todavía no hay nada". Además, si el curso no existe, ya has entrado en una pantalla que no tiene sentido.</p>
    <p><strong><code>resolve</code></strong> le da la vuelta: es un objeto de funciones que el router ejecuta <em>antes</em> de cambiar de ruta. Si alguna devuelve una promesa, el router <strong>espera</strong>. Solo cuando todas se cumplen entra en la ruta.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>El resolve...</th><th>Qué hace el router</th><th>Evento</th></tr></thead>
      <tbody>
        <tr><td>devuelve un valor</td><td>Entra en la ruta al momento</td><td><code>$routeChangeSuccess</code></td></tr>
        <tr><td>devuelve una promesa que se cumple</td><td>Espera y entra con el dato</td><td><code>$routeChangeSuccess</code></td></tr>
        <tr><td>devuelve una promesa rechazada</td><td><strong>No entra</strong>: se queda en la pantalla anterior</td><td><code>$routeChangeError</code></td></tr>
      </tbody>
    </table></div>
    <p>El resultado queda en <code>$resolve</code>, accesible desde la plantilla de la ruta: <code>template: '&lt;detalle-curso curso="$resolve.curso"&gt;&lt;/detalle-curso&gt;'</code>. El componente lo recibe por su binding <code>'&lt;'</code> y no sabe ni le importa de dónde vino.</p>

    <h3>Una guarda de ruta con resolve</h3>
    <p>Un resolve que <strong>rechaza</strong> impide entrar. Eso es exactamente una guarda: la ruta <code>/admin</code> tiene un resolve <code>acceso</code> que rechaza con el motivo <code>'NO_LOGUEADO'</code> si no hay sesión. Un único escuchador de <code>$routeChangeError</code> en un bloque <code>.run()</code> recibe el motivo y decide adónde mandar al usuario.</p>
    <div class="callout"><b>Trampa: $routeParams dentro de un resolve</b>
      <p>Mientras el resolve se ejecuta, <code>$routeParams</code> todavía tiene los parámetros de la ruta <em>anterior</em>: solo se actualiza cuando el cambio termina bien. Dentro de un resolve usa <code>$route.current.params</code>.</p>
    </div>

    <h3>Los eventos del router</h3>
    <ul>
      <li><code>$routeChangeStart</code> — va a empezar un cambio. Aquí encendemos el indicador de carga. Con <code>event.preventDefault()</code> se puede cancelar.</li>
      <li><code>$routeChangeSuccess</code> — la vista nueva ya está pintada.</li>
      <li><code>$routeChangeError</code> — algún resolve ha rechazado. Recibe <code>(evento, destino, origen, motivo)</code>.</li>
    </ul>
    <div class="callout ok"><b>Seguridad de verdad</b>
      <p>Una guarda en el navegador es comodidad, no seguridad: cualquiera puede abrir las herramientas de desarrollo y saltársela. Lo que protege los datos es que la <strong>API</strong> responda 401/403. La guarda solo evita enseñar pantallas que van a fallar.</p>
    </div>

    <h3>El límite de ngRoute</h3>
    <p>ngRoute tiene <strong>un solo <code>ng-view</code></strong>. No puedes tener una lista a la izquierda y el detalle a la derecha, cada uno con su propia URL, sin volver a cargar la lista al cambiar de detalle. Para eso existe ui-router, el siguiente paso.</p>

`(function () {
  'use strict';

  angular
    .module('cursoApp', ['ngRoute'])
    .config(configurarRutas);

  configurarRutas.$inject = ['$routeProvider'];

  function configurarRutas($routeProvider) {
    $routeProvider
      .when('/cursos', {
        // La plantilla solo instancia el componente.
        // $resolve es donde ngRoute deja los datos ya resueltos.
        template: '<lista-cursos cursos="$resolve.cursos"></lista-cursos>',
        resolve: {
          cursos: cargarCursos
        }
      })
      .when('/cursos/:id', {
        template: '<detalle-curso curso="$resolve.curso"></detalle-curso>',
        resolve: {
          curso: cargarCurso
        }
      })
      .when('/admin', {
        template: '<panel-admin></panel-admin>',
        resolve: {
          acceso: exigirLogin          // la guarda: si rechaza, no se entra
        }
      })
      .when('/login', {
        template: '<pantalla-login></pantalla-login>'
      })
      .otherwise({ redirectTo: '/cursos' });
  }

  // Cada resolve es una función inyectable. Si devuelve una promesa,
  // el router ESPERA a que se cumpla antes de pintar la vista.
  cargarCursos.$inject = ['cursosService'];

  function cargarCursos(cursosService) {
    return cursosService.getAll();
  }

  cargarCurso.$inject = ['$route', '$q', 'cursosService'];

  function cargarCurso($route, $q, cursosService) {
    // OJO: aquí $routeParams aún es el de la ruta anterior.
    var id = $route.current.params.id;

    return cursosService.getById(id).then(function (curso) {
      // Rechazar = no entrar en la ruta. El motivo viaja
      // hasta el escuchador de $routeChangeError.
      return curso || $q.reject('NO_ENCONTRADO');
    });
  }

  exigirLogin.$inject = ['$q', 'sesionService'];

  function exigirLogin($q, sesionService) {
    return sesionService.estaLogueado() ? true : $q.reject('NO_LOGUEADO');
  }
}());`

`(function () {
  'use strict';

  // .run() se ejecuta una vez, al arrancar, ya con los servicios listos.
  angular
    .module('cursoApp')
    .run(escucharRouter);

  escucharRouter.$inject = ['$rootScope', '$location'];

  function escucharRouter($rootScope, $location) {
    var redirigiendo = false;

    $rootScope.$on('$routeChangeStart', function () {
      $rootScope.cargando = true;
      if (!redirigiendo) { $rootScope.aviso = null; }
      redirigiendo = false;
    });

    $rootScope.$on('$routeChangeSuccess', function () {
      $rootScope.cargando = false;
    });

    // Un único sitio decide qué hacer con cada motivo de rechazo.
    $rootScope.$on('$routeChangeError', function (evento, destino, origen, motivo) {
      $rootScope.cargando = false;
      redirigiendo = true;

      if (motivo === 'NO_LOGUEADO') {
        $rootScope.aviso = 'Esa página es privada: identifícate primero.';
        $location.path('/login');
      } else if (motivo === 'NO_ENCONTRADO') {
        $rootScope.aviso = 'Ese curso no existe.';
        $location.path('/cursos');
      } else {
        redirigiendo = false;
        $rootScope.aviso = 'Error inesperado al cargar la ruta.';
      }
    });
  }
}());`

`(function () {
  'use strict';

  angular
    .module('cursoApp')
    .factory('cursosService', cursosService);

  cursosService.$inject = ['$http', '$q'];

  // $http lo vemos a fondo en el módulo 8. Hoy basta con saber
  // que devuelve una PROMESA: el dato llega más tarde.
  function cursosService($http, $q) {

    return {
      getAll:  getAll,
      getById: getById
    };

    function getAll() {
      return $http.get('api/cursos').then(function (response) {
        return response.data;
      });
    }

    // GET api/cursos/3 -> el curso, o un 404 si no existe
    function getById(id) {
      return $http.get('api/cursos/' + id)
        .then(function (response) {
          return response.data;
        })
        .catch(function (response) {
          if (response.status === 404) { return null; }   // "no existe" no es un fallo
          return $q.reject(response);                      // lo demás, sí
        });
    }
  }
}());`

  title: "ui-router: estados, vistas anidadas y componentes enrutados",
  goal: "Pasar de rutas a estados: lista y detalle en pantalla a la vez, cada uno con su URL, datos resueltos que llegan directos a los bindings del componente, y una guarda con $transitions.",
  notes: `
    <h3>De rutas a estados</h3>
    <p><strong>ui-router</strong> es el router que usa la mayoría de aplicaciones AngularJS grandes. Su idea central: la aplicación es una máquina de <strong>estados</strong> con nombre, y la URL es solo una de las propiedades de cada estado.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th></th><th>ngRoute</th><th>ui-router 1.x</th></tr></thead>
      <tbody>
        <tr><td>Módulo</td><td><code>'ngRoute'</code></td><td><code>'ui.router'</code></td></tr>
        <tr><td>Unidad</td><td>Ruta (una URL)</td><td>Estado (un nombre: <code>cursos.detalle</code>)</td></tr>
        <tr><td>Hueco en la vista</td><td>Un único <code>ng-view</code></td><td><code>ui-view</code> anidados, tantos como quieras</td></tr>
        <tr><td>Enlaces</td><td><code>href="#!/cursos/3"</code></td><td><code>ui-sref="cursos.detalle({ id: 3 })"</code></td></tr>
        <tr><td>Navegar en JS</td><td><code>$location.path()</code></td><td><code>$state.go('cursos.detalle', { id: 3 })</code></td></tr>
        <tr><td>Datos previos</td><td><code>resolve</code> + <code>$resolve</code> en la plantilla</td><td><code>resolve</code> que llega <strong>solo</strong> a los bindings del componente</td></tr>
        <tr><td>Guardas</td><td>Eventos <code>$routeChange*</code></td><td>Hooks: <code>$transitions.onBefore</code>, <code>onStart</code>, <code>onSuccess</code>...</td></tr>
      </tbody>
    </table></div>

    <h3>Estados anidados</h3>
    <p>El punto en el nombre define la jerarquía: <code>cursos.detalle</code> es hijo de <code>cursos</code>. Consecuencias:</p>
    <ul>
      <li>La URL se <strong>concatena</strong>: el padre tiene <code>/cursos</code>, el hijo <code>/{id:int}</code>, y juntos forman <code>#!/cursos/3</code>.</li>
      <li>El hijo se pinta en el <code>&lt;ui-view&gt;</code> que hay <strong>dentro de la plantilla del padre</strong>. La lista sigue ahí; solo cambia el hueco.</li>
      <li>Al pasar de un curso a otro, el padre <strong>no se vuelve a crear</strong> ni vuelve a pedir la lista.</li>
      <li>El hijo puede inyectar los resolves del padre: <code>buscarCurso</code> recibe <code>cursos</code> ya cargado, sin otra petición.</li>
    </ul>
    <p><code>{id:int}</code> declara el tipo del parámetro: llega como <strong>número</strong>. Se acabó el <code>Number($routeParams.id)</code> de la sesión 1.</p>

    <h3>Componentes enrutados</h3>
    <p>Con <code>component: 'cursoDetalle'</code> el estado pinta ese componente, y cada resolve se entrega al binding <strong>con el mismo nombre</strong>. El resolve <code>curso</code> llega a <code>bindings: { curso: '&lt;' }</code>. El componente no sabe que existe un router: es fácil de reutilizar y de probar.</p>

    <h3>Enlaces y navegación</h3>
    <ul>
      <li><code>ui-sref="cursos.detalle({ id: c.id })"</code> — genera el <code>href</code> correcto a partir del nombre del estado. Si cambias la URL del estado, los enlaces no se rompen.</li>
      <li><code>ui-sref-active="activo"</code> — añade la clase cuando ese estado, <em>o uno de sus hijos</em>, está activo. <code>ui-sref-active-eq</code> solo en coincidencia exacta.</li>
      <li><code>$state.go('cursos')</code> — navegar desde el controlador.</li>
    </ul>

    <h3>Hooks de transición</h3>
    <p>Cada cambio de estado es una <em>transición</em>, y puedes engancharte a sus fases en un bloque <code>.run()</code>:</p>
    <ul>
      <li><code>$transitions.onBefore(criterio, fn)</code> — antes de empezar. Si devuelve <code>false</code>, cancela; si devuelve un <code>TargetState</code> (<code>transicion.router.stateService.target('login')</code>), <strong>redirige</strong>. Es la guarda.</li>
      <li><code>onStart</code>, <code>onSuccess</code>, <code>onError</code> — perfectos para un indicador de carga.</li>
    </ul>
    <p>El criterio <code>{ to: fn }</code> filtra a qué estados se aplica. Aquí marcamos los estados privados con <code>data: { requiereLogin: true }</code>, y la guarda los reconoce sin que haya que listar nombres.</p>
    <div class="callout"><b>Versión</b>
      <p>Usamos <strong>@uirouter/angularjs 1.0.30</strong>. Si en tu proyecto ves <code>$stateChangeStart</code> o <code>$stateParams</code>, es la 0.x: los eventos de estado desaparecieron en la 1.0 y se sustituyen por los hooks de <code>$transitions</code>.</p>
    </div>
  `,

`(function () {
  'use strict';

  angular
    .module('cursoApp', ['ui.router'])      // ya no 'ngRoute'
    .config(configurarEstados);

  configurarEstados.$inject = ['$stateProvider', '$urlRouterProvider'];

  function configurarEstados($stateProvider, $urlRouterProvider) {
    $stateProvider
      .state({
        name: 'inicio',
        url: '/',
        template: '<h1>Inicio</h1><p>Entra en Cursos y elige uno: la lista no se mueve.</p>'
      })
      .state({
        name: 'cursos',
        url: '/cursos',
        component: 'cursosLista',           // se pinta este componente...
        resolve: {
          cursos: cargarCursos              // ...y esto llega a su binding "cursos"
        }
      })
      .state({

    .module('cursoApp')

  function configurarTransiciones($transitions, $rootScope, sesionService) {

    $transitions.onBefore({ to: requiereLogin }, function (transicion) {

        // Devolver un TargetState = redirigir a otro estado
        return transicion.router.stateService.target('login');

    // 2. Indicador de carga para todas las transiciones
    $transitions.onStart({}, function () { $rootScope.cargando = true; });
    $transitions.onSuccess({}, function () { $rootScope.cargando = false; });
    $transitions.onError({}, function () { $rootScope.cargando = false; });

    function requiereLogin(estado) {
      return !!(estado.data && estado.data.requiereLogin);
    }
  }

{
  id: "formularios-validacion",
  time: "16:10", end: "16:30", dur: 20,
  kind: "Teoría + lab",
  modulo: "Módulo 7",
  title: "Formularios: validación y mensajes con ngMessages",
  goal: "Validar un formulario sin escribir JavaScript de validación: atributos HTML, el estado del formulario y de cada campo, mensajes con ngMessages y un reinicio limpio tras enviar.",
  notes: `
    <h3>El formulario ya es un objeto</h3>
    <p>Cuando AngularJS encuentra un <code>&lt;form name="formAlta"&gt;</code>, crea un <strong>FormController</strong> y lo publica en el ámbito con ese nombre. Cada campo con <code>name</code> y <code>ng-model</code> crea un <strong>NgModelController</strong> dentro: <code>formAlta.email</code>. Sin <code>name</code>, el campo valida igual, pero no puedes preguntarle nada desde la plantilla.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Propiedad</th><th>Significa</th><th>Existe en</th></tr></thead>
      <tbody>
        <tr><td><code>$valid</code> / <code>$invalid</code></td><td>Pasa o no todas las validaciones</td><td>form y campo</td></tr>
        <tr><td><code>$pristine</code> / <code>$dirty</code></td><td>El usuario aún no ha escrito / ya ha escrito algo</td><td>form y campo</td></tr>
        <tr><td><code>$untouched</code> / <code>$touched</code></td><td>El campo aún no ha perdido el foco / ya lo ha perdido</td><td>form y campo</td></tr>
        <tr><td><code>$submitted</code></td><td>Se ha intentado enviar</td><td>form</td></tr>
        <tr><td><code>$pending</code></td><td>Hay un validador asíncrono en marcha</td><td>form y campo</td></tr>
        <tr><td><code>$error</code></td><td>Objeto con una clave por cada regla que falla: <code>{ required: true }</code></td><td>form y campo</td></tr>
      </tbody>
    </table></div>
    <p>Y todo eso se refleja también como <strong>clases CSS</strong> en el elemento: <code>ng-valid</code>, <code>ng-invalid</code>, <code>ng-dirty</code>, <code>ng-touched</code>, <code>ng-invalid-required</code>... La hoja <code>styles.css</code> pinta el borde en rojo con <code>input.ng-invalid.ng-touched</code>: solo después de que el usuario haya pasado por el campo, no nada más cargar.</p>

    <h3>Las reglas, como atributos</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Atributo</th><th>Clave en <code>$error</code></th></tr></thead>
      <tbody>
        <tr><td><code>required</code></td><td><code>required</code></td></tr>
        <tr><td><code>ng-minlength="3"</code> / <code>ng-maxlength="40"</code></td><td><code>minlength</code> / <code>maxlength</code></td></tr>
        <tr><td><code>ng-pattern="/^[0-9]{5}$/"</code></td><td><code>pattern</code></td></tr>
        <tr><td><code>type="email"</code></td><td><code>email</code></td></tr>
        <tr><td><code>type="number" min="16" max="99"</code></td><td><code>number</code>, <code>min</code>, <code>max</code></td></tr>
      </tbody>
    </table></div>
    <div class="callout"><b>novalidate, siempre</b>
      <p>Sin <code>novalidate</code> en el <code>&lt;form&gt;</code>, el navegador lanza sus propios globos de error, en su idioma y con su estilo, y bloquea el envío antes de que AngularJS se entere. Con <code>novalidate</code> la validación es solo nuestra.</p>
    </div>

    <h3>ngMessages</h3>
    <p>Encadenar <code>ng-if</code> por cada error se vuelve ilegible. <strong>ngMessages</strong> (módulo <code>'ngMessages'</code>, archivo <code>angular-messages.js</code>) recibe el objeto <code>$error</code> y enseña <strong>el primer</strong> mensaje que coincida, en el orden en que los escribes:</p>
    <ul>
      <li><code>ng-messages="formAlta.nombre.$error"</code> en el contenedor.</li>
      <li><code>ng-message="required"</code>, <code>ng-message="minlength"</code>... en cada mensaje.</li>
      <li><code>ng-messages-multiple</code> si quieres ver todos a la vez.</li>
    </ul>

    <h3>Enviar y reiniciar</h3>
    <ul>
      <li><code>ng-submit="$ctrl.guardar(formAlta)"</code> en el <code>&lt;form&gt;</code>, no <code>ng-click</code> en el botón: así también funciona pulsar Intro. Pasamos el formulario como argumento para que el controlador pueda reiniciarlo.</li>
      <li><code>ng-disabled="formAlta.$invalid"</code> en el botón: no se puede enviar hasta que todo sea válido. La alternativa es dejarlo activo y mostrar todos los errores cuando <code>$submitted</code> sea <code>true</code>; lo pruebas en el reto.</li>
      <li>Tras guardar: modelo nuevo, <code>form.$setPristine()</code> y <code>form.$setUntouched()</code>. Sin eso, el formulario vacío aparece lleno de errores en rojo.</li>
    </ul>
    <div class="callout ok"><b>Validar en el navegador no basta</b>
      <p>Todo esto es experiencia de usuario. El servidor <strong>tiene</strong> que volver a validar: cualquiera puede mandar una petición sin pasar por tu formulario.</p>
    </div>
  `,

`(function () {
  'use strict';

  angular
    .module('formApp', ['ngMessages'])     // angular-messages.js
    .component('altaAlumno', {
      templateUrl: 'alta-alumno.html',
      controller: AltaAlumnoController
    });

  AltaAlumnoController.$inject = [];

  function AltaAlumnoController() {
    var vm = this;

    vm.$onInit  = onInit;
    vm.guardar  = guardar;
    vm.limpiar  = limpiar;

    function onInit() {
      vm.alumnos = [];
      vm.alumno  = nuevoAlumno();
    }

    function nuevoAlumno() {
      return { nombre: '', email: '', edad: null, cp: '', nivel: '', acepta: false };
    }

    // Recibe el FormController desde la plantilla
    function guardar(form) {
      if (form.$invalid) { return; }        // doble seguro
      vm.alumnos.push(angular.copy(vm.alumno));
      limpiar(form);
    }

    function limpiar(form) {
      vm.alumno = nuevoAlumno();
      form.$setPristine();                  // quita $dirty y $submitted
      form.$setUntouched();                 // quita $touched de todos los campos
    }
  }
}());`

{
  id: "formularios-reactivos",
  time: "16:30", end: "16:50", dur: 20,
  kind: "Lab",
  modulo: "Módulo 7",
  title: "Validadores propios y formularios que reaccionan",
  goal: "Escribir un validador de DNI y otro asíncrono de email, entender el ngModelController por dentro, y hacer que el formulario recalcule cosas mientras el usuario escribe.",
  notes: `
    <h3>ngModelController por dentro</h3>
    <p>Cada <code>ng-model</code> tiene un controlador con dos valores y dos tuberías:</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Pieza</th><th>Qué es</th></tr></thead>
      <tbody>
        <tr><td><code>$viewValue</code></td><td>Lo que hay escrito en el input, tal cual (texto)</td></tr>
        <tr><td><code>$modelValue</code></td><td>Lo que llega a tu modelo (<code>$ctrl.datos.dni</code>)</td></tr>
        <tr><td><code>$parsers</code></td><td>Vista → modelo: transforman lo escrito (por ejemplo, texto a número)</td></tr>
        <tr><td><code>$formatters</code></td><td>Modelo → vista: cómo se enseña un valor que viene del código</td></tr>
        <tr><td><code>$validators</code></td><td>Funciones síncronas que devuelven <code>true</code> / <code>false</code></td></tr>
        <tr><td><code>$asyncValidators</code></td><td>Funciones que devuelven una promesa: se cumple = válido, rechaza = inválido</td></tr>
      </tbody>
    </table></div>
    <p>El recorrido al teclear: <code>$viewValue</code> → <code>$parsers</code> → <code>$validators</code> → (si todos pasan) <code>$asyncValidators</code> → <code>$modelValue</code>. Si algo falla, el modelo recibe <code>undefined</code>. La línea gris bajo el DNI lo enseña en vivo.</p>

    <h3>Un validador propio</h3>
    <p>Es una directiva de atributo que pide el <code>ngModel</code> del mismo elemento con <code>require: 'ngModel'</code> y le añade una función:</p>
    <ul>
      <li><code>ngModel.$validators.dni = function (modelValue, viewValue) { ... }</code></li>
      <li>La clave (<code>dni</code>) es el nombre del error: aparece en <code>$error.dni</code>, en la clase <code>ng-invalid-dni</code> y en <code>ng-message="dni"</code>.</li>
      <li>Si el campo está vacío, devuelve <code>true</code>: el "obligatorio" es cosa de <code>required</code>. Así cada regla hace una sola cosa.</li>
    </ul>
    <p>La letra del DNI es el resto de dividir el número entre 23, buscado en la cadena <code>TRWAGMYFPDXBNJZSQVHLCKE</code>. Para un NIE, la X, Y o Z inicial valen 0, 1 y 2. Prueba con <code>12345678Z</code>.</p>

    <h3>Un validador asíncrono</h3>
    <p>"¿Ese email ya está registrado?" solo lo sabe el servidor. <code>$asyncValidators</code> recibe una función que devuelve una <strong>promesa</strong>: si se cumple, válido; si se rechaza, inválido. Mientras espera, el campo y el formulario tienen <code>$pending</code>, y es buena idea bloquear el envío. Los asíncronos <strong>solo se ejecutan si pasan todos los síncronos</strong>: no se pregunta al servidor por un email mal escrito.</p>
    <p>Aquí el "servidor" es un servicio que responde con <code>$timeout</code> a los 600 ms. Los ocupados son <code>ana@ayesa.com</code>, <code>admin@ayesa.com</code> y <code>pedro@ayesa.com</code>.</p>

    <h3>ng-model-options</h3>
    <ul>
      <li><code>{ debounce: 500 }</code> — el modelo se actualiza 500 ms después de la última tecla. Imprescindible con validadores que llaman al servidor.</li>
      <li><code>{ updateOn: 'blur' }</code> — el modelo solo cambia al salir del campo.</li>
      <li><code>{ allowInvalid: true }</code> — el modelo recibe el valor aunque no sea válido.</li>
    </ul>

    <h3>Reaccionar a los cambios</h3>
    <p>En AngularJS, "formulario reactivo" significa que algo se recalcula solo cuando cambia el modelo. Tres herramientas, de más a menos recomendable:</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Herramienta</th><th>Cuándo salta</th><th>Úsala para</th></tr></thead>
      <tbody>
        <tr><td><code>ng-change="$ctrl.fn()"</code></td><td>Solo cuando <strong>el usuario</strong> cambia ese campo</td><td>Reacciones a un campo concreto (el cupón)</td></tr>
        <tr><td><code>$scope.$watch(fn, listener, true)</code></td><td>En cada <code>$digest</code> en que cambie lo observado, venga de donde venga</td><td>Valores derivados de varios campos (el total)</td></tr>
        <tr><td><code>$doCheck()</code></td><td>En cada <code>$digest</code>, sin comparar nada: compruebas tú</td><td>Casos raros; es el equivalente a <code>ngDoCheck</code> de Angular</td></tr>
      </tbody>
    </table></div>
    <p>Un componente no recibe <code>$scope</code> por defecto, pero puede <strong>inyectarlo</strong> (<code>$inject = ['$scope']</code>) para usar <code>$watch</code>. El tercer parámetro <code>true</code> hace una comparación profunda: detecta cambios en cualquier propiedad del objeto, a cambio de copiarlo en cada ciclo.</p>
    <div class="callout"><b>Cada $watch cuesta</b>
      <p>Un <code>$watch</code> se evalúa en <em>todos</em> los <code>$digest</code> de la aplicación, no solo cuando tocas este formulario. Uno profundo sobre un objeto pequeño no se nota; sobre una lista de mil elementos, sí. Si puedes resolverlo con <code>ng-change</code>, hazlo.</p>
    </div>

`(function () {
  'use strict';

  angular
    .module('formApp')
    .directive('dniValido', dniValido);

  dniValido.$inject = [];

  function dniValido() {
    var LETRAS = 'TRWAGMYFPDXBNJZSQVHLCKE';

    return {
      restrict: 'A',
      require: 'ngModel',          // pide el ngModelController del elemento
      link: link
    };

    // El cuarto parámetro es el controlador pedido con require
    function link(scope, element, attrs, ngModel) {

      // La clave "dni" será el nombre del error: $error.dni, ng-message="dni"
      ngModel.$validators.dni = function (modelValue, viewValue) {
        var valor = modelValue || viewValue;
        if (!valor) { return true; }        // vacío: eso lo decide required
        return esDniValido(valor);
      };
    }

    function esDniValido(texto) {
      var dni = String(texto).toUpperCase().replace(/[ -]/g, '');

      // NIE: X, Y, Z valen 0, 1, 2
      dni = dni.replace(/^X/, '0').replace(/^Y/, '1').replace(/^Z/, '2');

      if (!/^[0-9]{8}[A-Z]$/.test(dni)) { return false; }

      var numero = parseInt(dni.substr(0, 8), 10);
      return LETRAS.charAt(numero % 23) === dni.charAt(8);
    }
  }
}());`

`(function () {
  'use strict';

  angular
    .module('formApp')
    .directive('emailLibre', emailLibre);

  emailLibre.$inject = ['$q', 'usuariosService'];

  function emailLibre($q, usuariosService) {
    return {
      restrict: 'A',
      require: 'ngModel',
      link: link
    };

    function link(scope, element, attrs, ngModel) {

      // Asíncrono: devuelve una PROMESA.
      // Se cumple = válido. Se rechaza = inválido ($error.emailLibre).
      ngModel.$asyncValidators.emailLibre = function (modelValue, viewValue) {
        var email = modelValue || viewValue;
        if (!email) { return $q.resolve(); }

        return usuariosService.estaLibre(email).then(function (libre) {
          if (!libre) { return $q.reject('ocupado'); }
        });
      };
    }
  }
}());`

`(function () {
  'use strict';

  angular
    .module('formApp')
    .component('inscripcionCurso', {
      templateUrl: 'inscripcion/inscripcion.html',
      controller: InscripcionController
    });

  // Un componente no trae $scope, pero puede pedirlo para usar $watch
  InscripcionController.$inject = ['$scope'];

  function InscripcionController($scope) {
    var vm = this;
    var PRECIOS = { presencial: 300, online: 180, mixta: 240 };

    vm.$onInit      = onInit;
    vm.aplicarCupon = aplicarCupon;
    vm.enviar       = enviar;

    function onInit() {
      vm.datos = {
        dni: '', email: '', modalidad: 'presencial',
        plazas: 1, cupon: '', observaciones: ''
      };
      vm.descuento = 0;
      vm.total     = 0;
      vm.cambios   = 0;

      // Observa TODO el objeto (true = comparación profunda).
      // Cualquier cambio en cualquier campo recalcula el total.
      $scope.$watch(function () { return vm.datos; }, recalcular, true);
    }

    function recalcular() {
      var base = (PRECIOS[vm.datos.modalidad] || 0) * (vm.datos.plazas || 0);
      vm.total = base - base * vm.descuento;
      vm.cambios++;
    }

    // ng-change: solo cuando EL USUARIO toca el campo del cupón
    function aplicarCupon() {
      vm.descuento = (vm.datos.cupon || '').toUpperCase() === 'AYESA10' ? 0.10 : 0;
    }

    function enviar(form) {
      if (form.$invalid || form.$pending) { return; }
      vm.enviada = angular.copy(vm.datos);
      vm.enviada.total = vm.total;
    }
  }
}());`

  modulo: "Módulo 8",
  title: "Consumir APIs con $http y promesas",
  goal: "Leer y escribir datos contra una API con $http, encerrar las llamadas en un servicio, y pintar en el componente los tres estados de toda pantalla con datos remotos: cargando, error y listo.",
  notes: `
    <h3>$http en una tabla</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Llamada</th><th>Para qué</th></tr></thead>
      <tbody>
        <tr><td><code>$http.get(url, config)</code></td><td>Leer</td></tr>
        <tr><td><code>$http.post(url, datos, config)</code></td><td>Crear (el servidor suele responder 201)</td></tr>
        <tr><td><code>$http.put(url, datos, config)</code></td><td>Actualizar entero</td></tr>
        <tr><td><code>$http.delete(url, config)</code></td><td>Borrar (el servidor suele responder 204, sin cuerpo)</td></tr>
        <tr><td><code>$http(config)</code></td><td>La forma general: <code>{ method, url, data, params, headers, timeout }</code></td></tr>
      </tbody>
    </table></div>
    <p>El <code>config</code> más usado: <code>params</code> (se convierte en <code>?clave=valor</code>), <code>headers</code> y <code>timeout</code> en milisegundos. Los objetos que mandas en <code>datos</code> se serializan a JSON solos, y las respuestas JSON llegan ya convertidas a objetos.</p>

    <h3>Lo que devuelve: una promesa</h3>
    <p>Todas devuelven una <strong>promesa</strong>: un objeto que representa un valor que llegará más tarde. Se le cuelgan funciones:</p>
    <ul>
      <li><code>.then(fn)</code> — cuando llega. <code>fn</code> recibe el objeto <code>response</code>: <code>data</code> (el cuerpo), <code>status</code> (200, 404...), <code>headers()</code> y <code>config</code>.</li>
      <li><code>.catch(fn)</code> — si falla. Cualquier estado fuera de 200–299 es un fallo. <code>status: -1</code> significa que no hubo respuesta: red caída, CORS o <code>timeout</code>.</li>
      <li><code>.finally(fn)</code> — siempre, al final. Perfecto para apagar el "cargando".</li>
    </ul>

    <h3>Encadenar: la idea que lo cambia todo</h3>
    <p><code>.then()</code> devuelve <strong>otra promesa</strong>, que se cumple con lo que <em>devuelva</em> la función. Por eso el servicio puede hacer <code>return $http.get(URL).then(function (r) { return r.data; })</code> y quien lo usa recibe directamente los cursos, sin saber nada de <code>response</code>.</p>
    <div class="callout"><b>Las dos reglas del return</b>
      <p>1. Si una función de <code>.then</code> no hace <code>return</code>, el siguiente eslabón recibe <code>undefined</code>. 2. Si un <code>.catch</code> intermedio no vuelve a lanzar el error (<code>return $q.reject(error)</code>), la cadena <strong>se da por arreglada</strong> y el siguiente <code>.then</code> se ejecuta como si todo hubiera ido bien.</p>
    </div>

    <h3>El reparto de responsabilidades</h3>
    <ul>
      <li>El <strong>servicio</strong> sabe de URLs, métodos HTTP y del formato de la respuesta. Devuelve promesas de <em>datos</em>.</li>
      <li>El <strong>componente</strong> sabe de estados de pantalla: <code>cargando</code>, <code>error</code>, <code>ok</code>. No inyecta <code>$http</code>.</li>
    </ul>

    <h3>La API de este aula</h3>
    <p>La pestaña <code>api/cursos.json</code> define una pequeña API REST simulada, la colección <code>api/cursos</code>, con unos 400 ms de latencia para que veas el "cargando". Sigue las convenciones REST que encontrarás en cualquier backend: la colección para listar y crear, la URL del elemento para leer uno, actualizar y borrar.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Petición</th><th>Respuesta</th></tr></thead>
      <tbody>
        <tr><td><code>GET api/cursos</code></td><td>200 con la lista</td></tr>
        <tr><td><code>GET api/cursos/3</code></td><td>200 con el curso, o 404 si no existe</td></tr>
        <tr><td><code>POST api/cursos</code></td><td>201 con el curso creado, ya con su <code>id</code></td></tr>
        <tr><td><code>PUT api/cursos/3</code></td><td>200 con el curso reemplazado</td></tr>
        <tr><td><code>DELETE api/cursos/3</code></td><td>204, sin cuerpo</td></tr>
        <tr><td>cualquier otra <code>api/...</code></td><td>404</td></tr>
        <tr><td>una URL que contenga <code>error500</code></td><td>500</td></tr>
      </tbody>
    </table></div>
    <p>Los cambios se guardan en memoria: un POST aparece en el siguiente GET, hasta que la vista se recarga. Cada petición se apunta en la consola de abajo como <code>[api] GET api/cursos → 200</code>.</p>
  `,

    { name: "core/cursos-api.service.js", lang: "javascript", code:
`(function () {
  'use strict';

  angular
    .module('apiApp')
    .factory('cursosApi', cursosApi);

  cursosApi.$inject = ['$http'];

  // Toda la charla con el servidor, en un único sitio.
  // Hacia fuera solo salen promesas de DATOS, nunca el response entero.
  function cursosApi($http) {
    var URL = 'api/cursos';                 // la colección

    return {
      listar:     listar,
      obtener:    obtener,
      crear:      crear,
      actualizar: actualizar,
      borrar:     borrar,
      leerDe:     leerDe
    };

    // GET api/cursos
    function listar() {
      return $http.get(URL).then(extraerDatos);
    }

    // GET api/cursos/3
    function obtener(id) {
      return $http.get(URL + '/' + id).then(extraerDatos);
    }

    // POST a la colección: el servidor asigna el id
    function crear(curso) {
      return $http.post(URL, curso).then(extraerDatos);
    }

    // PUT a la URL del elemento
    function actualizar(curso) {
      return $http.put(URL + '/' + curso.id, curso).then(extraerDatos);
    }

    // DELETE a la URL del elemento
    function borrar(curso) {
      return $http.delete(URL + '/' + curso.id).then(function (response) {
        return response.status;             // 204: no hay cuerpo que devolver
      });
    }

    // Solo para la demo de errores: pide cualquier URL
    function leerDe(url) {
      return $http.get(url).then(extraerDatos);
    }

    // then() devuelve lo que devuelva esta función
    function extraerDatos(response) {
      return response.data;
    }
  }
}());`

    { name: "cursos/panel-cursos.component.js", lang: "javascript", code:
`(function () {
  'use strict';

  angular
    .module('apiApp')
    .component('panelCursos', {
      templateUrl: 'cursos/panel-cursos.html',
      controller: PanelCursosController
    });

  // El componente NO inyecta $http: habla con el servicio
  PanelCursosController.$inject = ['cursosApi'];

  function PanelCursosController(cursosApi) {
    var vm = this;

    vm.$onInit    = cargar;
    vm.cargar     = cargar;
    vm.probar     = probar;
    vm.crear      = crear;
    vm.subirHoras = subirHoras;
    vm.borrar     = borrar;

    vm.log = [];

    function cargar() {
      vm.estado = 'cargando';
      vm.error  = null;

      cursosApi.listar()
        .then(function (cursos) {
          vm.cursos = cursos;
          vm.estado = 'ok';
        })
        .catch(mostrarError)
        .finally(function () {
          anotar('GET terminado (con éxito o sin él)');
        });
    }

    function probar(url) {
      vm.estado = 'cargando';
      cursosApi.leerDe(url)
        .then(function () { vm.estado = 'ok'; })
        .catch(mostrarError);
    }

    function crear() {
      var nuevo = { nombre: vm.nuevoNombre || 'Curso sin nombre', horas: 10, area: 'Frontend' };

      cursosApi.crear(nuevo)
        .then(function (creado) {
          vm.cursos.push(creado);
          vm.nuevoNombre = '';
          anotar('POST: el servidor le ha dado el id ' + creado.id);
        })
        .catch(mostrarError);
    }

    function subirHoras(curso) {
      var cambiado = angular.extend({}, curso, { horas: curso.horas + 5 });

      cursosApi.actualizar(cambiado)
        .then(function (guardado) {
          angular.extend(curso, guardado);  // solo tocamos la vista si el servidor dice OK
          anotar('PUT: ' + curso.nombre + ' ahora tiene ' + curso.horas + ' h');
        })
        .catch(mostrarError);
    }

    function borrar(curso) {
      cursosApi.borrar(curso)
        .then(function (status) {
          vm.cursos.splice(vm.cursos.indexOf(curso), 1);
          anotar('DELETE: respuesta ' + status);
        })
        .catch(mostrarError);
    }

    function mostrarError(response) {
      vm.estado = 'error';
      vm.error = response.status === -1
        ? 'Sin respuesta del servidor (red, CORS o timeout)'
        : 'HTTP ' + response.status + ' al pedir ' + response.config.url;
      anotar('Error: ' + vm.error);
    }

    function anotar(texto) {
      vm.log.unshift(new Date().toLocaleTimeString() + ' · ' + texto);
    }
  }
}());`

  notes: `
    <h3>$q: las promesas de AngularJS</h3>
    <ul>
      <li><code>$q.resolve(valor)</code> / <code>$q.reject(motivo)</code> — una promesa ya cumplida o ya rechazada.</li>
      <li><code>$q(function (resolver, rechazar) { ... })</code> — crear una promesa propia, igual que <code>new Promise</code>.</li>
      <li><code>$q.all([p1, p2])</code> o <code>$q.all({ cursos: p1, alumnos: p2 })</code> — espera a <strong>todas</strong>. Con un objeto, el resultado llega con las mismas claves. Si <strong>una</strong> falla, falla el conjunto.</li>
    </ul>

    <h3>¿Por qué no la Promise del navegador?</h3>
    <p>Cuando una promesa <code>$q</code> se cumple, AngularJS lanza un <code>$digest</code> y la vista se actualiza. Una <code>Promise</code> nativa (o <code>fetch</code>, o <code>setTimeout</code>) vive fuera del mundo de Angular: el modelo cambia, pero nadie avisa a la vista. Es el mismo problema de <code>$apply</code> que visteis en el módulo 3. El botón "Promise nativa" de la derecha lo demuestra: el dato está en el modelo, pero no se pinta hasta el siguiente <code>$digest</code>.</p>
    <div class="callout ok"><b>Regla práctica</b>
      <p>Dentro de AngularJS: <code>$http</code>, <code>$q</code>, <code>$timeout</code>, <code>$interval</code>. Si una librería externa te devuelve una Promise nativa, envuélvela con <code>$q.when(promesaNativa)</code> y vuelves al mundo de Angular.</p>
    </div>

    <h3>Interceptores</h3>
    <p>Un interceptor es un servicio que se mete en <strong>todas</strong> las peticiones de <code>$http</code>. Se registra en un <code>.config()</code> con <code>$httpProvider.interceptors.push('nombreDelServicio')</code> y puede tener cuatro funciones:</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Función</th><th>Cuándo</th><th>Uso típico</th></tr></thead>
      <tbody>
        <tr><td><code>request(config)</code></td><td>Antes de salir</td><td>Añadir la cabecera <code>Authorization</code>, contar peticiones en curso</td></tr>
        <tr><td><code>requestError(rechazo)</code></td><td>Si un interceptor anterior falló</td><td>Poco habitual</td></tr>
        <tr><td><code>response(response)</code></td><td>Respuesta 2xx</td><td>Descontar peticiones, normalizar formatos</td></tr>
        <tr><td><code>responseError(rechazo)</code></td><td>Respuesta de error</td><td>Aviso global, redirigir a login en 401</td></tr>
      </tbody>
    </table></div>
    <div class="callout"><b>El return de responseError</b>
      <p><code>responseError</code> <strong>tiene</strong> que terminar con <code>return $q.reject(rechazo)</code>. Si devuelve otra cosa, el error se convierte en éxito para todo el que hizo la petición.</p>
    </div>
    <p>Con esto, el "cargando" y los mensajes de error dejan de repetirse en cada componente: la barra de estado de arriba funciona para cualquier petición de la aplicación, incluidas las plantillas que pide el router.</p>
    <p>Un interceptor no puede inyectar <code>$http</code> directamente: <code>$http</code> depende de los interceptores, y se formaría un círculo. Si lo necesitas, pide <code>$injector</code> y obtén <code>$http</code> dentro de la función.</p>

`(function () {
  'use strict';

  angular
    .module('apiApp')
    .factory('estadoHttp', estadoHttp)
    .factory('httpEstadoInterceptor', httpEstadoInterceptor);

  // 1. Un singleton con el estado de la red, que cualquiera puede leer
  estadoHttp.$inject = [];

  function estadoHttp() {
    var estado = {
      pendientes: 0,
      errores: [],
      limpiar: limpiar
    };
    return estado;

    function limpiar() { estado.errores.length = 0; }
  }

  // 2. El interceptor: pasa por aquí CADA petición de $http
  httpEstadoInterceptor.$inject = ['$q', 'estadoHttp'];

  function httpEstadoInterceptor($q, estadoHttp) {
    return {
      request:       request,
      response:      response,
      responseError: responseError
    };

    function request(config) {
      estadoHttp.pendientes++;
      return config;                        // hay que devolverla
    }

    function response(res) {
      estadoHttp.pendientes--;
      return res;
    }

    function responseError(rechazo) {
      estadoHttp.pendientes--;
      estadoHttp.errores.push({
        hora:   new Date(),
        status: rechazo.status,
        url:    rechazo.config && rechazo.config.url,
        texto:  explicar(rechazo.status)
      });
      return $q.reject(rechazo);            // ¡imprescindible!
    }

    function explicar(status) {
      if (status === -1)  { return 'Sin conexión con el servidor'; }
      if (status === 401) { return 'Sesión caducada'; }
      if (status === 404) { return 'Recurso no encontrado'; }
      if (status >= 500)  { return 'Error del servidor'; }
      return 'Error inesperado';
    }
  }
}());`

`(function () {
  'use strict';

  angular
    .module('apiApp')
    .component('resumenFormacion', {
      templateUrl: 'resumen/resumen.html',
      controller: ResumenController
    });

  ResumenController.$inject = ['$q', '$timeout', 'api'];

  function ResumenController($q, $timeout, api) {
    var vm = this;

    vm.$onInit       = cargarTodo;
    vm.cargarTodo    = cargarTodo;
    vm.cargarConFallo = cargarConFallo;
    vm.alumnosDe     = alumnosDe;
    vm.externos      = externos;
    vm.promesaNativa = promesaNativa;
    vm.promesaQ      = promesaQ;

    // Dos peticiones EN PARALELO; seguimos cuando llegan las dos
    function cargarTodo() {
      vm.estado = 'cargando';

      $q.all({ cursos: api.cursos(), alumnos: api.alumnos() })
        .then(function (r) {
          vm.cursos  = r.cursos;            // mismas claves que el objeto de entrada
          vm.alumnos = r.alumnos;
          vm.estado  = 'ok';
        })
        .catch(function () {
          vm.estado = 'error';              // el detalle ya lo pinta la barra de estado
        });
    }

    // Basta con que falle UNA para que falle el conjunto
    function cargarConFallo() {
      vm.estado = 'cargando';
      $q.all([api.cursos(), api.leerDe('api/error500')])
        .then(function () { vm.estado = 'ok'; })
        .catch(function () { vm.estado = 'error'; });
    }

    function alumnosDe(curso) {
      return (vm.alumnos || []).filter(function (a) {
        return a.cursoId === curso.id;
      }).length;
    }

    function externos() {
      api.usuariosExternos(3)
        .then(function (usuarios) { vm.usuarios = usuarios; })
        .catch(function () { vm.usuarios = []; });
    }

    // Promise del navegador: el modelo cambia, la vista NO se entera
    function promesaNativa() {
      new Promise(function (resolver) {
        setTimeout(function () { resolver(new Date().toLocaleTimeString()); }, 300);
      }).then(function (hora) {
        vm.hora = 'nativa, ' + hora;
      });
    }

    // $timeout devuelve una promesa $q: al cumplirse hay $digest
    function promesaQ() {
      $timeout(function () {
        return new Date().toLocaleTimeString();
      }, 300).then(function (hora) {
        vm.hora = '$q, ' + hora;
      });
    }
  }
}());`

    <p>Los <em>matchers</em> más usados: <code>toBe</code> (mismo objeto, <code>===</code>), <code>toEqual</code> (mismo contenido), <code>toContain</code>, <code>toBeTruthy</code>, <code>toBeUndefined</code>, <code>toBeCloseTo</code> (decimales), <code>toThrowError</code>, <code>toHaveBeenCalledWith</code>. Todos admiten <code>.not</code>.</p>

    <p><code>angular-mocks.js</code> añade tres funciones globales:</p>

    <h3>$httpBackend: un servidor falso y obediente</h3>
    <p>Con ngMock cargado, <code>$http</code> no sale a la red: habla con un <code>$httpBackend</code> falso al que <strong>tú</strong> le dices qué responder. Las respuestas no llegan hasta que llamas a <code>flush()</code>, así que controlas el tiempo.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Llamada</th><th>Qué hace</th></tr></thead>
      <tbody>
        <tr><td><code>$httpBackend.expectGET(url).respond(200, datos)</code></td><td>Exige que se haga esa petición (y en ese orden). Si no se hace, el test falla.</td></tr>
        <tr><td><code>$httpBackend.whenGET(url).respond(...)</code></td><td>Si se hace esa petición, responde esto. No exige nada. Útil en un <code>beforeEach</code>.</td></tr>
        <tr><td><code>expectPOST(url, cuerpo)</code></td><td>Comprueba también el cuerpo enviado.</td></tr>
        <tr><td><code>$httpBackend.flush()</code></td><td>Entrega todas las respuestas pendientes y ejecuta los <code>.then</code>.</td></tr>
        <tr><td><code>verifyNoOutstandingExpectation()</code> / <code>verifyNoOutstandingRequest()</code></td><td>En el <code>afterEach</code>: falla si quedó alguna petición esperada sin hacer o sin responder.</td></tr>
      </tbody>
    </table></div>

    <h3>$componentController: el componente sin plantilla</h3>
    <p><code>$componentController('listaCursos', locals, bindings)</code> crea el controlador de un componente sin compilar HTML:</p>
    <ul>
      <li><code>locals</code> — dependencias que quieres sustituir: <code>{ cursosApi: apiFalsa }</code>. El resto sale del inyector.</li>
      <li><code>bindings</code> — los valores de los bindings, como si vinieran del padre: <code>{ area: 'Backend', onElegir: espia }</code>. Para un <code>'&amp;'</code> pasas directamente una función (un espía).</li>

`(function () {
  'use strict';

  angular
    .module('cursoApp', [])
    .factory('cursosApi', cursosApi)
    .component('listaCursos', {
      bindings: {
        area:     '<',                      // filtro que llega del padre
        onElegir: '&'                       // aviso hacia el padre
      },
      template:
        '<p ng-if="$ctrl.cargando">Cargando...</p>' +
        '<p ng-if="$ctrl.error">{{ $ctrl.error }}</p>' +
        '<ul><li ng-repeat="c in $ctrl.visibles()">' +
        '  <a href ng-click="$ctrl.elegir(c)">{{ c.nombre }}</a>' +
        '</li></ul>',
      controller: ListaCursosController
    });

  cursosApi.$inject = ['$http'];

  function cursosApi($http) {
    var URL = 'api/cursos';

    return { listar: listar, crear: crear };

    function listar() {
      return $http.get(URL).then(function (r) { return r.data; });
    }

    function crear(curso) {
      return $http.post(URL, curso).then(function (r) { return r.data; });
    }
  }

  ListaCursosController.$inject = ['cursosApi'];

  function ListaCursosController(cursosApi) {
    var vm = this;

    vm.$onInit  = onInit;
    vm.visibles = visibles;
    vm.elegir   = elegir;

    function onInit() {
      vm.cursos   = [];
      vm.cargando = true;
      vm.error    = null;

      cursosApi.listar()
        .then(function (cursos) { vm.cursos = cursos; })
        .catch(function () { vm.error = 'No se han podido cargar los cursos'; })
        .finally(function () { vm.cargando = false; });
    }

    function visibles() {
      if (!vm.area) { return vm.cursos; }
      return vm.cursos.filter(function (c) { return c.area === vm.area; });
    }

    function elegir(curso) {
      vm.onElegir({ curso: curso });        // '&': se llama con un objeto de "locals"
    }
  }
}());`

  var cursosApi, $httpBackend;

  beforeEach(module('cursoApp'));

  beforeEach(inject(function (_cursosApi_, _$httpBackend_) {
    cursosApi    = _cursosApi_;
    $httpBackend = _$httpBackend_;
  }));

  // Ninguna petición esperada se quedó sin hacer ni sin responder
  afterEach(function () {
    $httpBackend.verifyNoOutstandingExpectation();
    $httpBackend.verifyNoOutstandingRequest();
  });

  it('listar() pide api/cursos y devuelve solo los datos', function () {
    var recibido;
    $httpBackend.expectGET('api/cursos')
                .respond(200, [{ id: 1, nombre: 'AngularJS' }]);

    cursosApi.listar().then(function (cursos) { recibido = cursos; });

    expect(recibido).toBeUndefined();       // todavía no ha "llegado"
    $httpBackend.flush();                   // ahora sí
    expect(recibido).toEqual([{ id: 1, nombre: 'AngularJS' }]);
  });

  it('listar() rechaza la promesa si el servidor da 500', function () {
    var status;
    $httpBackend.expectGET('api/cursos').respond(500, 'Error');

    cursosApi.listar().catch(function (response) { status = response.status; });
    $httpBackend.flush();

    expect(status).toBe(500);
  });

  it('crear() hace POST con el curso en el cuerpo', function () {
    var creado;
    $httpBackend.expectPOST('api/cursos', { nombre: 'Vue 3' })
                .respond(201, { id: 7, nombre: 'Vue 3' });

    cursosApi.crear({ nombre: 'Vue 3' }).then(function (c) { creado = c; });
    $httpBackend.flush();

    expect(creado.id).toBe(7);
  });
});`

  var $componentController, $q, $rootScope, apiFalsa;

  var CURSOS = [
    { id: 1, nombre: 'AngularJS', area: 'Frontend' },
    { id: 2, nombre: 'Java 21',   area: 'Backend' },
    { id: 3, nombre: 'Angular 19', area: 'Frontend' }
  ];

  beforeEach(module('cursoApp'));

  beforeEach(inject(function (_$componentController_, _$q_, _$rootScope_) {
    $componentController = _$componentController_;
    $q         = _$q_;
    $rootScope = _$rootScope_;

    // Un cursosApi FALSO: un espía que devuelve una promesa ya cumplida
    apiFalsa = {
      listar: jasmine.createSpy('listar').and.returnValue($q.resolve(CURSOS))
    };
  }));

  function crearCtrl(bindings) {
    // (nombre, locals que sustituyen dependencias, bindings)
    return $componentController('listaCursos', { cursosApi: apiFalsa }, bindings || {});
  }

  it('carga los cursos en $onInit', function () {
    var ctrl = crearCtrl();

    ctrl.$onInit();                         // nadie lo llama por nosotros
    expect(ctrl.cargando).toBe(true);

    $rootScope.$apply();                    // las promesas $q avanzan con un $digest
    expect(ctrl.cargando).toBe(false);
    expect(ctrl.cursos.length).toBe(3);
    expect(apiFalsa.listar).toHaveBeenCalled();
  });

  it('filtra por el binding area', function () {
    var ctrl = crearCtrl({ area: 'Frontend' });
    ctrl.$onInit();
    $rootScope.$apply();

    expect(ctrl.visibles().length).toBe(2);
  });

  it('avisa al padre por onElegir con el curso', function () {
    var onElegir = jasmine.createSpy('onElegir');
    var ctrl = crearCtrl({ onElegir: onElegir });

    ctrl.elegir(CURSOS[1]);

    expect(onElegir).toHaveBeenCalledWith({ curso: CURSOS[1] });
  });

  it('muestra un error si la API falla', function () {
    apiFalsa.listar.and.returnValue($q.reject({ status: 500 }));
    var ctrl = crearCtrl();

    ctrl.$onInit();
    $rootScope.$apply();

    expect(ctrl.error).toBe('No se han podido cargar los cursos');
    expect(ctrl.cargando).toBe(false);
  });
});`

    <p>El mismo componente <code>cursoForm</code> sirve para crear y para editar: si su binding <code>curso</code> llega vacío, es un alta.</p>

`(function () {
  'use strict';

  angular
    .module('gestorApp')
    .factory('cursosService', cursosService);

  cursosService.$inject = ['$http', '$q'];

  function cursosService($http, $q) {
    var URL   = 'api/cursos';
    var cache = null;

    return {
      listar:  listar,
      guardar: guardar
    };

    function listar() {
      if (cache) { return $q.resolve(cache); }
      return $http.get(URL).then(function (response) {
        cache = response.data;
        return cache;
      });
    }

    function guardar(curso) {
      return curso.id ? actualizar(curso) : crear(curso);
    }

    // POST a la colección: el servidor asigna el id
    function crear(curso) {
      return $http.post(URL, curso).then(function (response) {
        cache.push(response.data);          // la lista lo ve al instante
        return response.data;
      });
    }

    // PUT a la URL del elemento: api/cursos/3
    function actualizar(curso) {
      return $http.put(URL + '/' + curso.id, curso).then(function (response) {
        var original = buscar(curso.id);
        angular.extend(original, response.data);   // misma referencia: la lista se entera
        return original;
      });
    }

    function buscar(id) {
      return cache.filter(function (c) { return c.id === id; })[0];
    }
  }
}());`

`(function () {
  'use strict';

  angular
    .module('gestorApp')
    .component('cursoForm', {
      bindings: { curso: '<' },
      templateUrl: 'cursos/curso-form.html',
      controller: CursoFormController
    });

  CursoFormController.$inject = ['$state', 'cursosService'];

  function CursoFormController($state, cursosService) {
    var vm = this;

    vm.$onInit  = onInit;
    vm.guardar  = guardar;
    vm.cancelar = cancelar;

    function onInit() {
      vm.esNuevo = !vm.curso;
      vm.modelo = vm.curso
        ? angular.copy(vm.curso)
        : { nombre: '', horas: 20, area: 'Frontend', nivel: 'Inicial', activo: true };
      vm.guardando = false;
      vm.error = null;
    }

    function guardar(form) {
      if (form.$invalid) { return; }

      vm.guardando = true;
      vm.error = null;

      cursosService.guardar(vm.modelo)
        .then(function (guardado) {
          $state.go('cursos.detalle', { id: guardado.id });
        })
        .catch(function (response) {
          vm.error = 'No se ha podido guardar (' + response.status + ')';
        })
        .finally(function () {
          vm.guardando = false;
        });
    }

    function cancelar() {
      if (vm.esNuevo) {
        $state.go('cursos');
      } else {
        $state.go('cursos.detalle', { id: vm.curso.id });
      }
    }
  }
}());`

    <h3>Mantener con criterio</h3>
    <ul>
      <li><strong>Guía de estilo.</strong> La de John Papa (<em>angular-styleguide</em>, sección AngularJS) es la referencia del código de todo el curso: IIFE, un componente por archivo, <code>$inject</code>, funciones con nombre, carpetas por funcionalidad. Si el equipo la adopta, cualquier archivo se lee igual.</li>
      <li><strong>Cada cambio, un poco mejor.</strong> Si tocas un controlador suelto con <code>ng-controller</code> y <code>$scope</code>, conviértelo en componente. Si tocas un servicio sin tests, añade uno. No hace falta un proyecto de refactorización: basta con no empeorar.</li>
      <li><strong>Tests antes de tocar lo que da miedo.</strong> Un test que describe lo que el código hace <em>hoy</em> te deja cambiarlo mañana sin miedo.</li>

    <h3>Seguridad: el soporte terminó</h3>
    <p>El soporte oficial de AngularJS terminó el <strong>31 de diciembre de 2021</strong>. Desde entonces se han publicado vulnerabilidades (varias de denegación de servicio por expresiones regulares, y de saneamiento de atributos) que <strong>no tendrán parche oficial</strong>. En la práctica:</p>

      <li>Nunca metas HTML del usuario con <code>ng-bind-html</code> sin pasar por <code>$sanitize</code>, y no uses <code>$sce.trustAsHtml</code> con datos que no controlas.</li>
      <li>No mezcles plantillas del servidor con datos del usuario: las <code>{{ }}</code> que se cuelan en el HTML se evalúan (inyección de plantillas).</li>
      <li>Una <em>Content Security Policy</em> estricta y un escáner de dependencias (<code>npm audit</code>) en la integración continua.</li>
      <li>Existen proveedores comerciales de soporte extendido que siguen publicando parches, si la aplicación no puede migrar a corto plazo.</li>
    </ul>

    <h3>Si toca migrar a Angular</h3>
    <p>Lo que has hecho esta semana <strong>ya es preparación para migrar</strong>. Un componente AngularJS con bindings <code>'&lt;'</code> y <code>'&amp;'</code>, sin <code>$scope</code>, con su lógica en servicios, se traduce casi línea a línea a un componente de Angular con <code>@Input()</code> y <code>@Output()</code>.</p>
    <ol>
      <li><strong>Componentes primero.</strong> Todo controlador suelto, a componente. Toda directiva de elemento, a componente.</li>
      <li><strong>Servicios en lugar de <code>$rootScope</code></strong> para el estado compartido, y sin eventos <code>$broadcast</code>.</li>
      <li><strong>Un empaquetador y TypeScript</strong> (webpack, Vite) sobre el código AngularJS actual. Los IIFE pasan a ser módulos ES.</li>
      <li><strong>Aplicación híbrida con ngUpgrade</strong> (<code>@angular/upgrade/static</code>): las dos versiones conviven en la misma página; <code>downgradeComponent</code> usa componentes nuevos desde AngularJS, y el camino inverso permite reutilizar los antiguos. Se migra pantalla a pantalla hasta apagar AngularJS.</li>
      <li>La alternativa, cuando la aplicación está muy degradada: reescribir por rutas, sirviendo unas pantallas desde la aplicación nueva y otras desde la antigua, hasta que la antigua desaparece.</li>
    </ol>
    <div class="callout ok"><b>Para llevarse</b>
